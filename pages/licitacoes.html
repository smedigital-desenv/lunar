<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Licitações — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <a href="./dashboard.html">&#8592; Painel</a>
      <h1 class="app-header__titulo" id="titulo-pagina">Licitações</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina pagina--larga">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <form id="filtros" class="row g-2 mb-3" autocomplete="off">
      <div class="col-6 col-md-3">
        <select id="f-categoria" class="form-select form-select-sm" aria-label="Categoria">
          <option value="">Todas as categorias</option>
          <option value="almox_sede">Almox e Sede</option>
          <option value="nutricao">Nutrição</option>
          <option value="servicos_obras">Serviços e Obras</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="f-fase" class="form-select form-select-sm" aria-label="Fase">
          <option value="">Todas as fases</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="f-prioridade" class="form-select form-select-sm" aria-label="Prioridade">
          <option value="">Todas as prioridades</option>
          <option value="1_secretario">1 - Secretário</option>
          <option value="2_alta">2 - Alta</option>
          <option value="3_normal">3 - Normal</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <input id="f-busca" class="form-control form-control-sm" type="search"
               placeholder="Objeto ou número…"
               aria-label="Buscar por objeto ou número">
      </div>
      <div class="col-4 col-md-1 d-grid">
        <button id="f-parados" class="btn btn-sm btn-outline-danger" type="button"
                title="Só processos parados além do prazo da fase">Parados</button>
      </div>
      <div class="col-4 col-md-1 d-grid">
        <a class="btn btn-sm btn-outline-primary" href="./painel-licitacoes.html">Painel</a>
      </div>
      <div class="col-4 col-md-1 d-grid">
        <a class="btn btn-sm btn-primary" href="./nova-licitacao.html">+ Novo</a>
      </div>
    </form>

    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando…</div>
    <div id="paginacao" class="d-flex align-items-center justify-content-between gap-2 mt-2"></div>
  </main>

  <script type="module" src="../js/ui/licitacoes.js"></script>
</body>
</html>
