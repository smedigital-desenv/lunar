<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo pedido de compra — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__barra">
      <a href="./licitacoes.html" aria-label="Voltar" title="Voltar">&#8592;</a>
      <h1 class="app-header__titulo">Novo pedido de compra</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — o cadastro fica desabilitado sem sessão/banco.
    </div>

    <form id="form" class="cartao" autocomplete="off">
      <div class="mb-3">
        <label class="form-label" for="objeto">Objeto <span class="text-danger">*</span></label>
        <textarea class="form-control" id="objeto" rows="2" required
          placeholder="Ex.: Material escolar – Lista 1"></textarea>
      </div>
      <div class="row g-2">
        <div class="col-12 col-md-4 mb-3">
          <label class="form-label" for="categoria">Categoria <span class="text-danger">*</span></label>
          <select class="form-select" id="categoria" required>
            <option value="">— selecione —</option>
            <option value="almox_sede">Almox e Sede</option>
            <option value="nutricao">Nutrição</option>
            <option value="servicos_obras">Serviços e Obras</option>
          </select>
        </div>
        <div class="col-12 col-md-4 mb-3">
          <label class="form-label" for="prioridade">Prioridade</label>
          <select class="form-select" id="prioridade">
            <option value="3_normal" selected>3 - Normal</option>
            <option value="2_alta">2 - Alta</option>
            <option value="1_secretario">1 - Secretário</option>
          </select>
        </div>
        <div class="col-12 col-md-4 mb-3">
          <label class="form-label" for="unidade">Unidade solicitante</label>
          <select class="form-select" id="unidade">
            <option value="">(minha unidade)</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="texto">Descrição do pedido</label>
        <textarea class="form-control" id="texto" rows="3"
          placeholder="Detalhes que ajudem a equipe de licitações (itens, quantidade estimada, urgência…)"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label" for="solar">Nº do processo (Solar), se já existir</label>
        <input class="form-control" id="solar" type="text" placeholder="Ex.: 121273/2026">
      </div>
      <p class="texto-silencioso small">
        Entrada de pedidos: gerente ou acima. Fase, local, números do pregão e
        valores são preenchidos pela equipe de licitações durante o andamento.
      </p>
      <button class="btn btn-primary w-100" id="enviar" type="submit">Registrar pedido</button>
    </form>
  </main>

  <script type="module" src="../js/ui/nova-licitacao.js"></script>
</body>
</html>
