<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipes — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <a href="./admin.html">&#8592; Admin</a>
      <h1 class="app-header__titulo">Equipes</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — dados de exemplo (sem sessão/banco).
    </div>
    <div id="sem-permissao" class="alert alert-warning" role="alert" hidden>
      Você não tem permissão de administração. Fale com o administrador do sistema.
    </div>
    <div id="carregando" class="carregando">Carregando…</div>

    <div id="conteudo" hidden>
      <p class="texto-silencioso">
        A equipe de cada subsecretário/gerente é quem está lotado na área (unidade) dele.
        Use o seletor de cada pessoa para movê-la de área.
      </p>
      <div id="arvore-equipes"></div>
    </div>
  </main>

  <script type="module" src="../js/ui/equipes.js"></script>
</body>
</html>
