<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demanda — SME Ribeirão Preto</title>

  <!-- Bootstrap 5 (CDN) — base; o app.css complementa com o design próprio. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__barra">
      <a href="./caixa-entrada.html" aria-label="Voltar" title="Voltar">&#8592;</a>
      <h1 class="app-header__titulo">Gestão de Demandas</h1>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <div id="carregando" class="carregando">Carregando demanda…</div>

    <div id="conteudo" hidden>
      <!-- Cabeçalho -->
      <section class="cartao" id="cabecalho"></section>

      <!-- Dados / objeto-queixa -->
      <section class="cartao" id="dados"></section>

      <!-- Pessoas envolvidas -->
      <section class="cartao" id="pessoas"></section>

      <!-- Árvore de subtarefas -->
      <section class="cartao">
        <h2 class="cartao__titulo">Subtarefas</h2>
        <div id="arvore"></div>
      </section>

      <!-- Timeline -->
      <section class="cartao">
        <h2 class="cartao__titulo">Linha do tempo</h2>
        <ul class="timeline" id="timeline"></ul>
      </section>

      <!-- Ações conforme perfil -->
      <nav class="barra-acoes" id="acoes" aria-label="Ações da demanda"></nav>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
  <script type="module" src="../js/ui/demanda.js"></script>
</body>
</html>
