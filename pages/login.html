<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="tela-login">
  <main class="login">
    <section class="login__cartao">
      <header class="login__topo">
        <h1 class="login__titulo">Gestão de Demandas</h1>
        <p class="login__sub">Secretaria Municipal de Educação — Ribeirão Preto</p>
      </header>

      <div id="alerta" class="alert alert-danger" role="alert" hidden></div>

      <button id="btn-google" type="button" class="btn btn-primary w-100 mb-3">
        Entrar com Google
      </button>

      <p class="login__dominio texto-silencioso">
        Acesso restrito a contas <strong>@educacao.pmrp.sp.gov.br</strong>.
      </p>

      <details id="bloco-teste" class="login__teste">
        <summary>Acesso de teste (e-mail e senha)</summary>
        <form id="form-senha" class="mt-3" novalidate>
          <div class="mb-2">
            <label class="form-label" for="email">E-mail institucional</label>
            <input class="form-control" type="email" id="email" autocomplete="username"
                   placeholder="usuario@educacao.pmrp.sp.gov.br" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" id="senha" autocomplete="current-password" required>
          </div>
          <button id="btn-senha" type="submit" class="btn btn-outline-primary w-100">Entrar</button>
        </form>
      </details>

      <div id="aviso-demo" class="login__demo texto-silencioso" hidden>
        Modo demonstração — sem configuração de servidor. As telas usam dados de exemplo;
        o login real fica disponível após configurar <code>js/config.js</code>.
      </div>
    </section>
  </main>

  <script type="module" src="../js/ui/login.js"></script>
</body>
</html>
