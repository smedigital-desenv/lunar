<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — SME Ribeirão Preto</title>
  <!-- Fase 4: o login é único para toda a rede e acontece no Controle de
       Acesso central. Esta página existe só para encaminhar quem chegou aqui
       por link antigo ou favorito. O `replace` evita que o Voltar do
       navegador traga a pessoa de volta a um redirecionamento. -->
  <link rel="canonical" href="/central/login.html">
  <script>
    (function () {
      var destino = '/central/login.html';
      // Preserva o caminho de origem: o central devolve a pessoa exatamente
      // onde ela estava, em vez de jogá-la no portal.
      var proximo = new URLSearchParams(location.search).get('next');
      location.replace(destino + '?next=' + encodeURIComponent(proximo || '/lunar/pages/meus-processos.html'));
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="tela-login">
  <main class="login">
    <section class="login__cartao">
      <header class="login__topo">
        <h1 class="login__titulo">Gestão de Demandas</h1>
        <p class="login__sub">Secretaria Municipal de Educação — Ribeirão Preto</p>
      </header>

      <p class="login__dominio texto-silencioso">
        O acesso a este sistema é feito pelo login único da rede.
        Encaminhando você para lá…
      </p>

      <a class="btn btn-primary w-100" href="/central/login.html">Ir para o login da rede</a>
    </section>
  </main>
</body>
</html>
