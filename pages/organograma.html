<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organograma — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <h1 class="app-header__titulo">Organograma</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <div id="sem-permissao" class="alert alert-warning" role="alert" hidden>
      Seu perfil não pode gerir o organograma. Fale com o Gabinete ou com a
      administração do sistema.
    </div>

    <div id="carregando" class="carregando">Carregando…</div>

    <div id="conteudo" hidden>
      <div class="org-barra">
        <input id="busca" class="form-control form-control-sm" type="search"
               placeholder="Buscar unidade ou sigla…" aria-label="Buscar unidade">
        <div class="org-barra__acoes">
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="ver-inativas">
            <label class="form-check-label small" for="ver-inativas">Ver inativas</label>
          </div>
          <button id="btn-recolher" type="button" class="btn btn-sm btn-outline-secondary">
            Recolher tudo
          </button>
        </div>
      </div>

      <p id="resumo" class="texto-silencioso"></p>
      <div id="arvore" class="org-arvore"></div>
    </div>
  </main>

  <!-- O bundle do Bootstrap é obrigatório aqui: `modais.js` instancia
       `new bootstrap.Modal(...)`, e só o CSS não basta. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
  <script type="module" src="../js/ui/organograma.js"></script>
</body>
</html>
