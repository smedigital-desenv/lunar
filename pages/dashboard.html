<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
  <!-- Chart.js (CDN, sem build step). Se indisponível, o painel cai em barras. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <a href="./caixa-entrada.html">&#8592; Entrada</a>
      <a href="./caixa-saida.html">Saída</a>
      <h1 class="app-header__titulo">Painel gerencial</h1>
      <a href="./pesquisa.html">Pesquisa &#8594;</a>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>
    <div id="carregando" class="carregando">Carregando painel…</div>

    <div id="conteudo" hidden>
      <div class="kpis" id="kpis"></div>

      <div class="graficos">
        <section class="cartao">
          <h2 class="cartao__titulo">Por situação</h2>
          <div class="grafico"><canvas id="g-situacao"></canvas></div>
        </section>
        <section class="cartao">
          <h2 class="cartao__titulo">Por prioridade</h2>
          <div class="grafico"><canvas id="g-prioridade"></canvas></div>
        </section>

        <section class="cartao cartao--largo">
          <h2 class="cartao__titulo">Evolução mensal (criadas × concluídas)</h2>
          <div class="grafico grafico--largo"><canvas id="g-evolucao"></canvas></div>
        </section>

        <section class="cartao">
          <h2 class="cartao__titulo">Por setor</h2>
          <div class="grafico"><canvas id="g-setor"></canvas></div>
        </section>
        <section class="cartao">
          <h2 class="cartao__titulo">Por responsável</h2>
          <div class="grafico"><canvas id="g-responsavel"></canvas></div>
        </section>
        <section class="cartao">
          <h2 class="cartao__titulo">Por unidade</h2>
          <div class="grafico"><canvas id="g-unidade"></canvas></div>
        </section>
        <section class="cartao">
          <h2 class="cartao__titulo">Por tipo</h2>
          <div class="grafico"><canvas id="g-tipo"></canvas></div>
        </section>

        <section class="cartao">
          <h2 class="cartao__titulo">Tempo médio de atendimento</h2>
          <div id="tempo-medio" class="kpi__valor"></div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="../js/ui/dashboard.js"></script>
</body>
</html>
