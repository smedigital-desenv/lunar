<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <h1 class="app-header__titulo">Painel</h1>
      <a href="./pesquisa.html">Pesquisa &#8594;</a>
      <div id="sino-notificacoes" class="app-header__sino"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>
    <div id="carregando" class="carregando">Carregando painel…</div>

    <div id="conteudo" hidden>
      <div class="kpis" id="kpis"></div>

      <section class="cartao">
        <h2 class="cartao__titulo">Por prioridade</h2>
        <div id="por-prioridade"></div>
      </section>
      <section class="cartao">
        <h2 class="cartao__titulo">Por setor</h2>
        <div id="por-setor"></div>
      </section>
      <section class="cartao">
        <h2 class="cartao__titulo">Por responsável</h2>
        <div id="por-responsavel"></div>
      </section>
      <section class="cartao">
        <h2 class="cartao__titulo">Tempo médio de atendimento</h2>
        <div id="tempo-medio" class="kpi__valor"></div>
      </section>
    </div>
  </main>

  <script type="module" src="../js/ui/dashboard.js"></script>
</body>
</html>
