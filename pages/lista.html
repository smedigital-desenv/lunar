<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demandas — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <a href="./dashboard.html">&#8592; Painel</a>
      <h1 class="app-header__titulo" id="titulo-pagina">Demandas</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina pagina--larga">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <form id="filtros" class="row g-2 mb-3" autocomplete="off">
      <div class="col-12 col-md-4">
        <input id="f-busca" class="form-control form-control-sm" type="search"
               placeholder="Título ou número…" aria-label="Buscar por título ou número">
      </div>
      <div class="col-6 col-md-2 d-grid">
        <a class="btn btn-sm btn-outline-primary" href="./pesquisa.html">Buscar</a>
      </div>
      <div class="col-6 col-md-2 d-grid">
        <a class="btn btn-sm btn-primary" href="./nova-demanda.html">+ Nova</a>
      </div>
      <!-- As opções saem do organograma real; some para quem enxerga uma
           só secretaria, porque aí não há o que separar. lista.js troca
           o `hidden` deste bloco (não do <select> lá dentro). -->
      <div class="col-12" id="campo-unidade" hidden>
        <details class="filtros-exp">
          <summary>Filtros</summary>
          <div class="filtros-exp__corpo row g-2">
            <div class="col-12 col-md-4">
              <select id="f-unidade" class="form-select form-select-sm"
                      aria-label="Filtrar por secretaria">
                <option value="">Todas as secretarias</option>
              </select>
            </div>
          </div>
        </details>
      </div>
    </form>

    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando…</div>
    <div id="paginacao" class="d-flex align-items-center justify-content-between gap-2 mt-2"></div>
  </main>

  <script type="module" src="../js/ui/lista.js"></script>
</body>
</html>
