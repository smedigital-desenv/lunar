<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processo de Licitação — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__barra">
      <a href="./licitacoes.html" aria-label="Voltar" title="Voltar">&#8592;</a>
      <h1 class="app-header__titulo">Licitações</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <div id="carregando" class="carregando">Carregando processo…</div>

    <div id="conteudo" hidden>
      <!-- Cabeçalho: número, objeto, chips -->
      <section class="cartao" id="cabecalho"></section>

      <!-- Números externos, valores e dados do pedido -->
      <section class="cartao" id="dados"></section>

      <!-- Timeline -->
      <section class="cartao">
        <h2 class="cartao__titulo">Histórico</h2>
        <ul class="timeline" id="timeline"></ul>
      </section>

      <!-- Ações (equipe de licitações; a trava real é o banco) -->
      <nav class="barra-acoes" id="acoes" aria-label="Ações do processo"></nav>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
  <script type="module" src="../js/ui/processo-licitacao.js"></script>
</body>
</html>
