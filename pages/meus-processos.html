<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus processos — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <h1 class="app-header__titulo" id="titulo-pagina">Meus processos</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <!-- Abas: entrada vs saída -->
    <div class="mb-3">
      <div class="btn-group" role="tablist">
        <button class="btn btn-sm btn-primary" data-aba="entrada" role="tab" aria-selected="true">
          📥 Entrada (tarefas)
        </button>
        <button class="btn btn-sm btn-outline-primary" data-aba="saida" role="tab" aria-selected="false">
          📤 Saída (demandas)
        </button>
      </div>
    </div>

    <!-- Filtros e busca -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <div id="filtros"></div>
      <div class="ms-auto">
        <input type="text" id="busca" class="form-control form-control-sm"
               placeholder="Buscar por número ou título…" style="width: 250px;">
      </div>
    </div>

    <!-- Lista -->
    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando…</div>

    <!-- Paginação -->
    <div id="paginacao" class="d-flex align-items-center justify-content-between gap-2 mt-2"></div>
  </main>

  <script type="module" src="../js/ui/meus-processos.js"></script>
</body>
</html>
