<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus processos — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <a href="./dashboard.html">&#8592; Painel</a>
      <h1 class="app-header__titulo" id="titulo-pagina">Meus processos</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina pagina--larga">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <div id="aviso-teto" class="tarja-demo" hidden>
      Você tem mais de 500 processos — a lista mostra os primeiros. Use a
      Pesquisa para alcançar o restante.
    </div>

    <form id="filtros" class="row g-2 mb-3" autocomplete="off">
      <div class="col-12 col-md-4">
        <input id="f-busca" class="form-control form-control-sm" type="search"
               placeholder="Título ou número…" aria-label="Buscar por título ou número">
      </div>
      <div class="col-6 col-md-1 d-grid">
        <a class="btn btn-sm btn-outline-primary" href="./pesquisa.html">Buscar</a>
      </div>
      <div class="col-6 col-md-1 d-grid">
        <a class="btn btn-sm btn-primary" href="./nova-demanda.html">+ Nova</a>
      </div>
      <div class="col-12">
        <details class="filtros-exp">
          <summary>Filtros</summary>
          <div class="filtros-exp__corpo row g-2">
            <div class="col-6 col-md-3">
              <select id="f-posse" class="form-select form-select-sm" aria-label="Aguardando">
                <option value="todos">Aguardando: todos</option>
                <option value="aguardando_mim">Minha resposta</option>
                <option value="aguardando_outros">Outras pessoas</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <select id="f-tipo" class="form-select form-select-sm" aria-label="Tipo">
                <option value="todos">Todos os tipos</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <select id="f-situacao" class="form-select form-select-sm" aria-label="Situação">
                <option value="todos">Todas as situações</option>
                <option value="pendentes">Pendentes</option>
                <option value="em_andamento">Em andamento</option>
                <option value="urgentes">Urgentes</option>
                <option value="encerrados">Encerrados</option>
              </select>
            </div>
          </div>
        </details>
      </div>
    </form>

    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando…</div>
    <div id="paginacao" class="d-flex align-items-center justify-content-between gap-2 mt-2"></div>
  </main>

  <script type="module" src="../js/ui/meus-processos.js"></script>
</body>
</html>
