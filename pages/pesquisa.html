<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisa — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__barra">
      <h1 class="app-header__titulo" id="titulo-pagina">Pesquisa</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — busca sobre dados de exemplo (sem sessão/banco).
    </div>

    <section class="cartao">
      <form id="form-busca" class="row g-2">
        <div class="col-12">
          <input type="search" class="form-control" name="termo"
                 placeholder="Número, título, objeto, aluno, processo Solar, texto de devolutivas…">
        </div>
        <div class="col-12">
          <details class="filtros-exp">
            <summary>Filtros</summary>
            <div class="filtros-exp__corpo row g-2">
              <div class="col-12 col-sm-6 col-md-3">
                <select class="form-select" name="situacao">
                  <option value="">Situação</option>
                  <option value="aberta">Aberta</option>
                  <option value="em_andamento">Em andamento</option>
                  <option value="aguardando_complementacao">Aguardando complementação</option>
                  <option value="devolvida">Devolvida</option>
                  <option value="concluida">Concluída</option>
                  <option value="reaberta">Reaberta</option>
                </select>
              </div>
              <div class="col-12 col-sm-6 col-md-3">
                <select class="form-select" name="prioridade">
                  <option value="">Prioridade</option>
                  <option value="baixa">Baixa</option>
                  <option value="normal">Normal</option>
                  <option value="alta">Alta</option>
                  <option value="urgente">Urgente</option>
                </select>
              </div>
              <div class="col-12 col-sm-6 col-md-3">
                <input type="date" class="form-control" name="de" title="De">
              </div>
              <div class="col-12 col-sm-6 col-md-3">
                <input type="date" class="form-control" name="ate" title="Até">
              </div>
            </div>
          </details>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Pesquisar</button>
        </div>
      </form>
    </section>

    <div id="lista"></div>
    <div id="carregando" class="carregando" hidden>Buscando…</div>
    <div id="paginacao" class="d-flex align-items-center justify-content-between gap-2 mt-2"></div>
  </main>

  <script type="module" src="../js/ui/pesquisa.js"></script>
</body>
</html>
