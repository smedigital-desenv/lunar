<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Licitações — SME Ribeirão Preto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__barra">
      <a href="./licitacoes.html" aria-label="Voltar" title="Voltar">&#8592;</a>
      <h1 class="app-header__titulo">Painel de Licitações</h1>
      <div id="sino-notificacoes" class="app-header__sino"></div>
      <div id="usuario-sessao" class="app-header__sessao"></div>
    </div>
  </header>

  <main class="pagina pagina--larga">
    <div id="tarja-demo" class="tarja-demo" hidden>
      Modo demonstração — exibindo dados de exemplo (sem sessão/banco).
    </div>

    <div id="carregando" class="carregando">Carregando painel…</div>

    <div id="conteudo" hidden>
      <!-- Indicadores gerais (clicáveis -> lista filtrada) -->
      <div class="kpis" id="kpis"></div>

      <!-- Processos por fase -->
      <section class="cartao">
        <h2 class="cartao__titulo">Por fase</h2>
        <div class="fases" id="fases"></div>
      </section>

      <!-- Quebras menores -->
      <section class="cartao">
        <h2 class="cartao__titulo">Por categoria e prioridade</h2>
        <div id="quebras"></div>
      </section>

      <!-- Pregões agendados -->
      <section class="cartao">
        <h2 class="cartao__titulo">Próximos pregões</h2>
        <div id="pregoes"></div>
      </section>
    </div>
  </main>

  <script type="module" src="../js/ui/painel-licitacoes.js"></script>
</body>
</html>
