<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Demandas — SME Ribeirão Preto</title>
  <!-- Porta de entrada de https://smedigital.com.br/lunar/.
       Sem este arquivo, o endereço sem página cai no 404 do GitHub Pages e
       não há nada para disparar a guarda de acesso.

       Aqui não se decide login nenhum: só encaminha para uma tela do sistema.
       É a guarda (js/auth-central.js, via sessao.js) que leva ao
       /central/login.html quem não tem sessão na rede — e quem já tem entra
       direto, sem passar pela tela de login. -->
  <script>
    (function () {
      var PADRAO = 'pages/caixa-entrada.html';

      // Aceita `?next=` só como caminho DENTRO deste sistema. Sem essa
      // conferência, `?next=https://outro.site` transformaria a página numa
      // ponte de redirecionamento para qualquer endereço.
      function destinoSeguro(valor) {
        if (!valor) return null;
        if (valor.indexOf(':') !== -1 || valor.indexOf('//') !== -1) return null;
        if (valor.indexOf('/lunar/') === 0) return valor;
        if (valor.indexOf('pages/') === 0) return valor;
        return null;
      }

      var pedido = null;
      try {
        pedido = destinoSeguro(new URLSearchParams(location.search).get('next'));
      } catch (_) { /* navegador antigo: segue para o padrão */ }

      // `replace` para o Voltar do navegador não trazer a pessoa de volta
      // a um redirecionamento.
      location.replace(pedido || PADRAO);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="tela-login">
  <!-- Visível apenas sem JavaScript, ou no instante antes do encaminhamento. -->
  <main class="login">
    <section class="login__cartao">
      <header class="login__topo">
        <h1 class="login__titulo">Gestão de Demandas</h1>
        <p class="login__sub">Secretaria Municipal de Educação — Ribeirão Preto</p>
      </header>

      <p class="login__dominio texto-silencioso">
        O acesso é feito pelo login único da rede. Abrindo o sistema…
      </p>

      <a class="btn btn-primary w-100" href="pages/caixa-entrada.html">Entrar</a>
    </section>
  </main>
</body>
</html>
